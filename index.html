
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>College Event Management</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f5fa;
}
header {
    background: #243b70;
    color: white;
    padding: 22px;
    text-align: center;
}
nav {
    background: #172b53;
    padding: 15px;
    text-align: center;
}
nav button {
    background: #fff;
    border: none;
    padding: 12px 22px;
    margin: 5px;
    cursor: pointer;
    border-radius: 5px;
}
nav button:hover { background: #a9d4ff; }
main {
    max-width: 850px;
    margin: 25px auto;
    padding: 20px;
}
.card {
    background: white;
    padding: 20px;
    margin: 15px 0;
    border-radius: 8px;
    box-shadow: 0 2px 6px #ddd;
}
input, select {
    display: block;
    width: 100%;
    padding: 12px;
    margin: 12px 0;
    border: 1px solid #bbb;
    border-radius: 5px;
}
.action {
    background: #2463bd;
    color: white;
    padding: 11px 18px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}
.delete { background: #c93030; }
</style>
</head>
<body>

<header>
<h1>College Event Management System</h1>
<p>Manage and Register for College Events</p>
</header>

<nav>
<button onclick="home()">Home</button>
<button onclick="loadPage('admin.html')">Admin</button>
<button onclick="loadPage('user.html')">Student</button>
</nav>

<main id="content"></main>

<script>
const content = document.getElementById("content");

function home() {
    content.innerHTML = `
        <div class="card">
            <h2>Welcome to College Events</h2>
            <p>Explore technical, cultural and sports events.</p>
            <p>Admin can create events and students can register.</p>
            <button class="action"
                onclick="loadPage('user.html')">
                View Events
            </button>
        </div>`;
}

// Fetch and merge HTML pages
async function loadPage(page) {
    try {
        const response = await fetch(page);
        if (!response.ok) throw new Error("Page not found");
        content.innerHTML = await response.text();
        if (page === "admin.html") showAdminEvents();
        if (page === "user.html") showUserEvents();
    } catch (error) {
        content.textContent = "Error: " + error.message;
    }
}

function getEvents() {
    return JSON.parse(localStorage.getItem("events") || "[]");
}

function saveEvents(events) {
    localStorage.setItem("events", JSON.stringify(events));
}

function addEvent(event) {
    event.preventDefault();
    const name = document.getElementById("eventName").value;
    const date = document.getElementById("eventDate").value;
    const venue = document.getElementById("eventVenue").value;

    const events = getEvents();
    events.push({ id: Date.now(), name, date, venue });
    saveEvents(events);

    alert("Event added successfully!");
    document.getElementById("eventForm").reset();
    showAdminEvents();
}

function createEventCard(event, admin) {
    const card = document.createElement("div");
    card.className = "card";

    const title = document.createElement("h3");
    title.textContent = event.name;
    card.appendChild(title);

    const info = document.createElement("p");
    info.textContent = `Date: ${event.date} | Venue: ${event.venue}`;
    card.appendChild(info);

    const button = document.createElement("button");
    button.className = admin ? "action delete" : "action";
    button.textContent = admin ? "Delete" : "Register";

    button.onclick = () => admin
        ? deleteEvent(event.id)
        : registerEvent(event.id);

    card.appendChild(button);
    return card;
}

function showAdminEvents() {
    const list = document.getElementById("adminEvents");
    if (!list) return;
    list.innerHTML = "";
    getEvents().forEach(e =>
        list.appendChild(createEventCard(e, true))
    );
}

function deleteEvent(id) {
    saveEvents(getEvents().filter(e => e.id !== id));
    showAdminEvents();
}

function showUserEvents() {
    const list = document.getElementById("userEvents");
    if (!list) return;
    list.innerHTML = "";
    const events = getEvents();

    if (events.length === 0) {
        list.textContent = "No events available.";
        return;
    }
    events.forEach(e =>
        list.appendChild(createEventCard(e, false))
    );
}

function registerEvent(id) {
    const name = prompt("Enter your name:");
    if (!name || !name.trim()) return;

    const registrations = JSON.parse(
        localStorage.getItem("registrations") || "[]"
    );
    registrations.push({ eventId: id, student: name.trim() });
    localStorage.setItem(
        "registrations", JSON.stringify(registrations)
    );
    alert("Registration successful!");
}

home();
</script>
</body>
</html>
